services:
  - type: web
    name: stageviva-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: STAGEVIVA_DB
        value: /var/data/stageviva.db
      - key: STAGEVIVA_UPLOADS_DIR
        value: /var/data/uploads
      - key: STAGEVIVA_DAILY_SOURCE_LIMIT
        value: "1"
      - key: STAGEVIVA_DAILY_TOTAL_ANALYSIS_LIMIT
        value: "5"
      - key: STAGEVIVA_SOURCE_SCANS_ENABLED
        value: "false"
      - key: STAGEVIVA_AI_REQUESTS_ENABLED
        value: "false"
      - key: STAGEVIVA_ALLOWED_AI_MODELS
        value: "gpt-4o-mini"
      - key: STAGEVIVA_AI_DAILY_REQUEST_LIMIT
        value: "100"
      - key: STAGEVIVA_AI_USAGE_STATE_PATH
        value: /var/data/ai-request-usage.json
      - key: STAGEVIVA_MAX_MATCHES_PER_REFRESH
        value: "20"
      - key: STAGEVIVA_MAX_ARTISTS_PER_OPPORTUNITY
        value: "20"
