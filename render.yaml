services:
  - type: web
    name: stageviva-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: STAGEVIVA_DB
        value: /var/data/stageviva.db
      - key: STAGEVIVA_UPLOADS_DIR
        value: /var/data/uploads
      - key: STAGEVIVA_DAILY_SOURCE_LIMIT
        value: "5"
